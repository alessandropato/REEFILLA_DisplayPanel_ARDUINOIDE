<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Display V3.1 (1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0A0F1A;
    --bg-deep:   #06090f;
    --line:      #252C3B;
    --line-soft: #181D28;
    --accent:    #D2F68C;
    --accent-2:  #6666C5;
    --text:      #FDFBF2;
    --dot:          var(--accent-2);
    --dot-glow:     rgba(102,102,197,0.5);
    --carica:       var(--accent);
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-deep);
    min-height: 100vh;
    font-family: 'Orbitron', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    box-sizing: border-box;
  }
  .frame {
    position: relative;
    width: 480px; height: 480px;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 8px 60px 0 rgba(0,0,0,0.95), 0 0 0 1px var(--line-soft);
    flex: 0 0 auto;
  }
  .row-divider { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
  .div-top { top: 20.5px; }
  .div-mid { top: 78.5px; }

  .wifi {
    position: absolute; left: 0; right: 0; top: 0; height: 20.5px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 11px; letter-spacing: 0.06em;
  }
  .topbar { position: absolute; left: 0; right: 0; top: 20.5px; height: 58px; }
  .voltab-block {
    position: absolute; left: 24px; top: 14px; width: 88px;
    text-align: center; line-height: 1;
  }
  .voltab-block .voltab { color: var(--accent); font-size: 16px; letter-spacing: 0.04em; display: block; }
  .voltab-block .power  { color: var(--line); font-size: 14px; letter-spacing: 0.08em; font-weight: 500; display: block; margin-top: 9px; }
  .auto-block { position: absolute; left: 0; right: 0; top: 14px; text-align: center; line-height: 1; }
  .auto-block .label { color: var(--text); font-size: 18px; font-weight: 500; letter-spacing: 0.06em; display: block; }
  .auto-block .value { color: var(--text); font-size: 16px; letter-spacing: 0.02em; display: block; margin-top: 7px; }

  /* FIX V3.1(1): centrato verticalmente nel topbar (top:0; height:58px) */
  .carica {
    position: absolute; right: 22px; top: 0; height: 58px;
    display: flex; align-items: center; gap: 6px; line-height: 1;
  }
  .carica .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--dot); box-shadow: 0 0 6px var(--dot-glow);
    transition: background-color 350ms ease;
  }
  .carica .label { color: var(--carica); font-size: 16px; letter-spacing: 0.04em; transition: color 350ms ease; }

  .stage { position: absolute; left: 0; top: 78.5px; right: 0; bottom: 90px; }
  .scale-100, .scale-0 { position: absolute; color: var(--line); font-size: 10px; font-weight: 500; letter-spacing: 0.05em; line-height: 1; }
  .scale-100 { left: 226px; top: 30px; }
  .scale-0   { left: 232px; top: 268.5px; }
  .center-text { position: absolute; left: 0; right: 0; top: 80px; text-align: center; line-height: 1; z-index: 5; pointer-events: none; }
  .center-text .num { color: var(--accent-2); font-size: 40px; letter-spacing: 0.02em; display: block; transition: color 350ms ease; }
  .center-text .pct { color: var(--accent-2); font-size: 30px; display: block; margin-top: 12px; }
  .mono { position: absolute; left: 0; top: 0; width: 480px; height: 311.5px; }

  .powerrow {
    position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
    display: flex; flex-direction: row; align-items: center; justify-content: space-around;
    padding: 0 16px; box-sizing: border-box;
  }
  .pcell { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; line-height: 1; }
  .pcell .linea { color: var(--text); font-size: 15px; letter-spacing: 0.04em; }
  .pcell .bar   { width: 78px; height: 1px; background: var(--line); }
  .pcell .val   { color: var(--accent-2); font-size: 18px; letter-spacing: 0.02em; font-weight: 500; }
  .pcell .unit  { color: var(--line); font-size: 15px; letter-spacing: 0.04em; }

  /* Tweaks panel */
  .tweaks {
    position: fixed; right: 24px; bottom: 24px; width: 260px;
    background: rgba(14,18,28,0.95); backdrop-filter: blur(14px);
    border: 1px solid #1F2636; border-radius: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #FDFBF2; z-index: 1000; overflow: hidden;
  }
  .tw-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid #1F2636;
  }
  .tw-head .title { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 0.16em; color: #D2F68C; }
  .tw-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .tw-group { display: flex; flex-direction: column; gap: 6px; }
  .tw-lbl { font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 0.18em; color: #6B7385; text-transform: uppercase; }
  .tw-row { display: flex; gap: 6px; align-items: center; }
  .tw-row label { font-size: 11px; color: #9CA3AF; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: #D2F68C; }
  .tw-val { width: 30px; text-align: right; color: #D2F68C; font-size: 11px; }
  .tw-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .tw-btn {
    flex: 1 1 auto; padding: 7px 6px; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,0.02); border: 1px solid #232A3B;
    color: #B6BCCB; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    text-align: center; transition: all 180ms ease;
  }
  .tw-btn:hover { color: #FDFBF2; border-color: #344158; }
  .tw-btn.active { background: rgba(210,246,140,0.10); border-color: #6F8540; color: #D2F68C; }
</style>
</head>
<body>

<div class="frame">
  <div class="wifi" id="t-wifi">Connesso al Wifi&nbsp;|&nbsp;192.168.1.50</div>
  <div class="row-divider div-top"></div>

  <div class="topbar">
    <div class="voltab-block">
      <span class="voltab">VOLTAB</span>
      <span class="power">POWER</span>
    </div>
    <div class="auto-block">
      <span class="label">AUTONOMIA</span>
      <span class="value" id="t-autonomy">1h 30min.</span>
    </div>
    <div class="carica">
      <span class="dot" id="t-dot"></span>
      <span class="label" id="t-carica">CARICA</span>
    </div>
  </div>

  <div class="row-divider div-mid"></div>

  <div class="stage">
    <div class="scale-100">100%</div>
    <div class="scale-0">0%</div>

    <svg class="mono" viewBox="0 0 480 311.5" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- Gradiente SOC: sale dal basso in proporzione alla carica -->
        <linearGradient id="vFill" x1="240" y1="46" x2="240" y2="259.7" gradientUnits="userSpaceOnUse">
          <stop offset="0"    stop-color="#252C3B" id="vf-0"/>
          <stop offset="0.78" stop-color="#252C3B" id="vf-1"/>
          <stop offset="0.92" stop-color="#D2F68C" id="vf-2"/>
          <stop offset="1"    stop-color="#D2F68C" id="vf-3"/>
        </linearGradient>
      </defs>
      <path d="M 142.77 46 L 96 46 L 220.769 259.7 L 256.738 259.7 L 266.18 259.7 L 242.927 219.628 L 142.77 46 Z" fill="url(#vFill)"/>
      <path d="M 336.763 46 L 285.989 135.069 L 303.265 135.069 L 253.876 220.608 L 253.75 220.826 L 359.931 125.834 L 337.664 125.834 L 383.52 46.003 L 336.76 46 Z" fill="url(#vFill)"/>
      <path d="M 303.514 135 L 348 136.662 L 254 220.756 L 254.125 220.539 L 303.514 135 Z" fill="url(#vFill)"/>
      <path d="M 207 157 L 161 157 L 192 210 L 220.5 259 L 235.006 259 L 239.5 259 L 266 259 L 252.5 236.5 L 207 157 Z" fill="url(#vFill)"/>
    </svg>

    <div class="center-text">
      <span class="num" id="t-pct">20</span>
      <span class="pct">%</span>
    </div>
  </div>

  <div class="powerrow">
    <div class="pcell">
      <span class="linea">Linea 1</span><span class="bar"></span>
      <span class="val" id="t-l1">+1200</span><span class="unit">W</span>
    </div>
    <div class="pcell">
      <span class="linea">Linea 2</span><span class="bar"></span>
      <span class="val" id="t-l2">-850</span><span class="unit">W</span>
    </div>
    <div class="pcell">
      <span class="linea">Linea 3</span><span class="bar"></span>
      <span class="val" id="t-l3">+430</span><span class="unit">W</span>
    </div>
  </div>
</div>

<!-- Pannello tweaks semplificato -->
<aside class="tweaks">
  <div class="tw-head"><span class="title">TWEAKS · V3.1 (1)</span></div>
  <div class="tw-body">
    <div class="tw-group">
      <div class="tw-lbl">SOC %</div>
      <div class="tw-row">
        <input type="range" id="sl-soc" min="0" max="100" value="20"/>
        <span class="tw-val" id="sl-soc-val">20%</span>
      </div>
    </div>
    <div class="tw-group">
      <div class="tw-lbl">Stato</div>
      <div class="tw-opts" id="tw-state"></div>
    </div>
  </div>
</aside>

<script>
(() => {
  const LOW = 20;
  const LOW_TIP  = '#EF4444';
  const LOW_BASE = '#3A1417';

  const STATES = {
    carica:  { label:"Carica",   autonomy:"1h 30min.", carica:"CARICA",  dot:"#6666C5", caricaCol:"#D2F68C", pctCol:"#6666C5" },
    scarica: { label:"Scarica",  autonomy:"4h 12min.", carica:"SCARICA", dot:"#6666C5", caricaCol:"#6666C5", pctCol:"#6666C5" },
    standby: { label:"Stand-by", autonomy:"Stand-by",  carica:"STANDBY", dot:"#252C3B", caricaCol:"#252C3B", pctCol:"#6666C5" },
  };

  let curState = 'carica';

  function updateFill(soc) {
    const isLow    = soc < LOW;
    const baseCol  = isLow ? LOW_BASE : '#252C3B';
    const tipCol   = isLow ? LOW_TIP  : '#D2F68C';
    const level    = 1 - soc / 100;
    const band     = 0.14;
    const s1 = Math.max(0, Math.min(1, level - band * 0.2)).toFixed(3);
    const s2 = Math.max(0, Math.min(1, level + band * 0.8)).toFixed(3);
    document.getElementById('vf-0').setAttribute('stop-color', baseCol);
    document.getElementById('vf-1').setAttribute('stop-color', baseCol);
    document.getElementById('vf-2').setAttribute('stop-color', tipCol);
    document.getElementById('vf-3').setAttribute('stop-color', tipCol);
    document.getElementById('vf-1').setAttribute('offset', s1);
    document.getElementById('vf-2').setAttribute('offset', s2);
    const pctNum = document.getElementById('t-pct');
    const pctSym = document.querySelector('.center-text .pct');
    const pCol = isLow ? LOW_TIP : STATES[curState].pctCol;
    pctNum.style.color = pCol;
    pctSym.style.color = pCol;
    pctNum.textContent = String(soc);
  }

  function applyState(key) {
    curState = key;
    const s = STATES[key];
    document.getElementById('t-autonomy').textContent = s.autonomy;
    document.getElementById('t-carica').textContent   = s.carica;
    document.getElementById('t-carica').style.color   = s.caricaCol;
    document.getElementById('t-dot').style.background = s.dot;
    document.documentElement.style.setProperty('--dot', s.dot);
    document.documentElement.style.setProperty('--carica', s.caricaCol);
    updateFill(parseInt(document.getElementById('sl-soc').value));
    renderStateButtons();
  }

  function renderStateButtons() {
    const wrap = document.getElementById('tw-state');
    wrap.innerHTML = '';
    Object.entries(STATES).forEach(([k, s]) => {
      const b = document.createElement('button');
      b.className = 'tw-btn' + (curState === k ? ' active' : '');
      b.textContent = s.label;
      b.onclick = () => applyState(k);
      wrap.appendChild(b);
    });
  }

  document.getElementById('sl-soc').addEventListener('input', e => {
    const v = parseInt(e.target.value);
    document.getElementById('sl-soc-val').textContent = v + '%';
    updateFill(v);
  });

  renderStateButtons();
  updateFill(20);
})();
</script>
</body>
</html>
