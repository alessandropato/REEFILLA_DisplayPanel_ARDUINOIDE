<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=560">
  <title>REEFILLA Display – Simulatore 480×480</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0A0F1A;
      --accent:  #22C5C8;
      --track:   #1C212C;
      --border:  #14181F;
      --divider: #1A2030;
      --green:   #4ADE80;
      --yellow:  #F0B429;
      --red:     #EF4444;
      --teal:    #22D3EE;
      --w88:     #E0E0E0;
      --dim:     #636873;
      --vdim:    #3D424D;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060810;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      gap: 28px;
      font-family: 'Montserrat', sans-serif;
    }

    /* ─── Display frame 480×480 ─── */
    #display {
      width: 480px;
      height: 480px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px #181d28,
        0 8px 60px rgba(0,0,0,0.95),
        0 0 50px rgba(34,197,200,0.06);
      flex-shrink: 0;
    }
    #display * { font-family: 'Montserrat', sans-serif; }

    /* ─── TOP BAR (h=58, bottom border) ─── */
    #top-bar {
      position: absolute;
      left: 0; top: 0;
      width: 480px; height: 58px;
      border-bottom: 1px solid var(--border);
    }

    /* Left: brand */
    #brand-col {
      position: absolute;
      left: 20px; top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .t-brand { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 1.5px; }
    .t-power { font-size: 14px; font-weight: 500; color: var(--vdim);   letter-spacing: 1.5px; }

    /* Center: autonomia */
    #time-col {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .t-auto-title { font-size: 14px; font-weight: 500; color: var(--dim);  letter-spacing: 1px; }
    #time-value   { font-size: 20px; font-weight: 600; color: var(--w88);  letter-spacing: 0.3px; }

    /* Right: status */
    #status-row {
      position: absolute;
      right: 20px; top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.pulse { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
    #status-text {
      font-size: 14px; font-weight: 500;
      color: var(--dim);
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }

    /* ─── SVG overlay (arc gauge) ─── */
    #arc-svg {
      position: absolute;
      left: 0; top: 0;
      width: 480px; height: 480px;
      pointer-events: none;
    }

    /* ─── Center text (at arc center 240,236) ─── */
    #center-col {
      position: absolute;
      left: 240px;
      top: 236px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }
    #soc-value {
      font-size: 48px; font-weight: 700;
      color: var(--accent);
      line-height: 1;
      transition: color 0.3s;
    }
    #soc-pct {
      font-size: 28px; font-weight: 600;
      color: var(--dim);
      line-height: 1;
    }

    /* ─── Arc edge labels (LVGL pixel coords) ─── */
    .arc-lbl {
      position: absolute;
      top: 342px;
      font-size: 14px; font-weight: 500;
      color: var(--vdim);
    }
    #lbl-0   { left: 113px; }
    #lbl-100 { left: 340px; }

    /* ─── Horizontal divider ─── */
    #h-div {
      position: absolute;
      left: 20px; top: 369px;
      width: 440px; height: 1px;
      background: var(--divider);
    }

    /* ─── Power row (y=370, h=90) ─── */
    #power-row {
      position: absolute;
      left: 0; top: 370px;
      width: 480px; height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }
    .power-col {
      flex: 1;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .vsep { width: 1px; height: 50px; background: var(--divider); flex-shrink: 0; }
    .ln-title { font-size: 14px; font-weight: 500; color: var(--dim);  letter-spacing: 0.5px; }
    .ln-value { font-size: 20px; font-weight: 600; color: var(--teal); transition: color .2s; }
    .ln-unit  { font-size: 14px; font-weight: 400; color: var(--vdim); }

    /* ─── WiFi bar (y=460, h=20, top border) ─── */
    #wifi-bar {
      position: absolute;
      left: 0; top: 460px;
      width: 480px; height: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #wifi-text {
      font-size: 13px; font-weight: 400;
      color: var(--vdim);
      letter-spacing: 0.2px;
      transition: color .3s;
    }

    /* ─── Controls panel ─── */
    .controls {
      width: 480px;
      background: #0C1118;
      border: 1px solid #1A2030;
      border-radius: 6px;
      padding: 20px;
    }
    .controls h3 {
      font-size: 10px; font-weight: 700;
      color: var(--accent);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
    .full { grid-column: 1/-1; }
    .ci { display: flex; flex-direction: column; gap: 6px; }
    .ci label {
      font-size: 10px; font-weight: 600;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .ci .vd {
      font-size: 13px; font-weight: 600;
      color: var(--w88);
    }
    input[type=range] {
      width: 100%; height: 3px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    select, input[type=number] {
      background: var(--bg);
      color: var(--w88);
      border: 1px solid #1A2030;
      border-radius: 4px;
      padding: 6px 9px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px; font-weight: 500;
      width: 100%;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

<!-- ═══════════ DISPLAY 480×480 ═══════════ -->
<div id="display">

  <!-- TOP BAR -->
  <div id="top-bar">
    <div id="brand-col">
      <span class="t-brand">REEFILLA</span>
      <span class="t-power">POWER</span>
    </div>
    <div id="time-col">
      <span class="t-auto-title">AUTONOMIA</span>
      <span id="time-value">---</span>
    </div>
    <div id="status-row">
      <div id="status-dot"></div>
      <span id="status-text">---</span>
    </div>
  </div>

  <!-- ARC GAUGE SVG
       Arc center: (240, 236)  |  r=123  |  start=120°  |  span=300° clockwise
       Gap (60°) at bottom between ~60° and ~120°  -->
  <svg id="arc-svg" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
    <!-- glow behind fill (very subtle) -->
    <path id="arc-glow" fill="none"
          stroke="#22C5C8" stroke-width="24" stroke-linecap="round"
          opacity="0.07" d=""/>
    <!-- background track -->
    <path id="arc-bg" fill="none"
          stroke="#1C212C" stroke-width="14" stroke-linecap="round"
          d="M 178.50 342.50 A 123 123 0 1 1 301.50 342.50"/>
    <!-- foreground fill (dynamic) -->
    <path id="arc-fg" fill="none"
          stroke="#22C5C8" stroke-width="14" stroke-linecap="round"
          d=""/>
  </svg>

  <!-- CENTER TEXT -->
  <div id="center-col">
    <span id="soc-value">---</span>
    <span id="soc-pct">%</span>
  </div>

  <!-- ARC EDGE LABELS -->
  <span class="arc-lbl" id="lbl-0">0%</span>
  <span class="arc-lbl" id="lbl-100">100%</span>

  <!-- HORIZONTAL DIVIDER -->
  <div id="h-div"></div>

  <!-- POWER ROW -->
  <div id="power-row">
    <div class="power-col" id="col-0">
      <span class="ln-title">LINEA 1</span>
      <span class="ln-value" id="val-0">---</span>
      <span class="ln-unit">W</span>
    </div>
    <div class="vsep" id="vsep-0"></div>
    <div class="power-col" id="col-1">
      <span class="ln-title">LINEA 2</span>
      <span class="ln-value" id="val-1">---</span>
      <span class="ln-unit">W</span>
    </div>
    <div class="vsep" id="vsep-1"></div>
    <div class="power-col" id="col-2">
      <span class="ln-title">LINEA 3</span>
      <span class="ln-value" id="val-2">---</span>
      <span class="ln-unit">W</span>
    </div>
  </div>

  <!-- WIFI BAR -->
  <div id="wifi-bar">
    <span id="wifi-text">WiFi: ---</span>
  </div>

</div><!-- /display -->

<!-- ═══════════ CONTROLS ═══════════ -->
<div class="controls">
  <h3>Simulatore display</h3>
  <div class="grid">

    <div class="ci full">
      <label>SOC — <span id="soc-lbl" style="color:var(--accent);font-weight:700;">75</span>%</label>
      <input type="range" id="c-soc" min="0" max="100" value="75">
    </div>

    <div class="ci full">
      <label>Stato sistema (main_state)</label>
      <select id="c-state">
        <option value="-1">--- (nessun dato CAN)</option>
        <option value="0">0 – INIT</option>
        <option value="1">1 – ALIGN</option>
        <option value="2">2 – STANDBY</option>
        <option value="3" selected>3 – CARICA</option>
        <option value="4">4 – SCARICA</option>
        <option value="5">5 – SCARICA ON-GRID</option>
        <option value="90">90 – WARNING</option>
        <option value="99">99 – ERRORE</option>
      </select>
    </div>

    <div class="ci">
      <label>Autonomia (minuti)</label>
      <input type="number" id="c-time" value="90" min="0" max="9999">
    </div>

    <div class="ci">
      <label>Inverter attivi (inv_count)</label>
      <select id="c-inv">
        <option value="0">0 – nessuno</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
      </select>
    </div>

    <div class="ci">
      <label>Potenza linea 1 (W)</label>
      <input type="number" id="c-p0" value="1200">
    </div>
    <div class="ci">
      <label>Potenza linea 2 (W)</label>
      <input type="number" id="c-p1" value="-850">
    </div>
    <div class="ci">
      <label>Potenza linea 3 (W)</label>
      <input type="number" id="c-p2" value="430">
    </div>

    <div class="ci">
      <label>WiFi</label>
      <select id="c-wifi">
        <option value="none">--- (nessun dato)</option>
        <option value="disconnected">Non connesso</option>
        <option value="connected" selected>Connesso – 192.168.1.50</option>
      </select>
    </div>

  </div>
</div>

<script>
// ── Palette ──────────────────────────────────────────
const C = {
  accent: '#22C5C8', green:  '#4ADE80', yellow: '#F0B429',
  red:    '#EF4444', teal:   '#22D3EE', w88:    '#E0E0E0',
  dim:    '#636873', vdim:   '#3D424D',
};

// ── Arc geometry ─────────────────────────────────────
// LVGL: center=(240,236), ARC_SZ=260, ARC_W=14 → r≈123
// rotation=120°, bg_angles(0,300) → clockwise 300° arc, 60° gap at bottom
const ARC = { cx: 240, cy: 236, r: 123, s: 120, span: 300 };

const toRad = d => d * Math.PI / 180;

function pt(deg) {
  return [
    ARC.cx + ARC.r * Math.cos(toRad(deg)),
    ARC.cy + ARC.r * Math.sin(toRad(deg))
  ];
}

function arcPath(startDeg, spanDeg) {
  if (spanDeg <= 0) return '';
  if (spanDeg >= 360) spanDeg = 359.9;
  const [sx, sy] = pt(startDeg);
  const [ex, ey] = pt(startDeg + spanDeg);
  const large = spanDeg > 180 ? 1 : 0;
  return `M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${ARC.r} ${ARC.r} 0 ${large} 1 ${ex.toFixed(2)} ${ey.toFixed(2)}`;
}

// SOC → arc color (mirrors soc_color() in ui_main.cpp)
function socColor(soc) {
  if (soc > 60) return C.green;
  if (soc > 25) return C.yellow;
  return C.red;
}

// main_state → { color, label } (mirrors state_info() in ui_main.cpp)
function stateInfo(s) {
  const map = {
     0: [C.dim,    'INIT'],
     1: [C.dim,    'ALIGN'],
     2: [C.teal,   'STANDBY'],
     3: [C.green,  'CARICA'],
     4: [C.teal,   'SCARICA'],
     5: [C.teal,   'SCARICA ON-GRID'],
    90: [C.yellow, 'WARNING'],
    99: [C.red,    'ERRORE'],
  };
  return map[s] ?? [C.dim, '---'];
}

// time_to_* display (mirrors pick_time_min() formatting)
function fmtTime(min) {
  if (!min || min <= 0) return '---';
  if (min > 16 * 60)   return '>16h';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;
}

// ── Render ────────────────────────────────────────────
function render() {
  const soc      = parseInt(document.getElementById('c-soc').value);
  const stateRaw = parseInt(document.getElementById('c-state').value);
  const timeMins = parseInt(document.getElementById('c-time').value) || 0;
  const invCount = parseInt(document.getElementById('c-inv').value);
  const powers   = [0,1,2].map(i => parseInt(document.getElementById(`c-p${i}`).value) || 0);
  const wifi     = document.getElementById('c-wifi').value;
  const hasData  = stateRaw !== -1;

  document.getElementById('soc-lbl').textContent = soc;

  // ── Arc fill ──
  const arcCol   = hasData ? socColor(soc) : C.accent;
  const fillPath = (!hasData || soc === 0)
    ? ''
    : arcPath(ARC.s, soc * ARC.span / 100);

  document.getElementById('arc-fg').setAttribute('stroke', arcCol);
  document.getElementById('arc-fg').setAttribute('d', fillPath);
  document.getElementById('arc-glow').setAttribute('stroke', arcCol);
  document.getElementById('arc-glow').setAttribute('d', fillPath);

  // ── SOC text ──
  const socEl = document.getElementById('soc-value');
  socEl.textContent  = hasData ? String(soc) : '---';
  socEl.style.color  = arcCol;

  // ── Status dot + label ──
  const [siColor, siLabel] = hasData ? stateInfo(stateRaw) : [C.dim, '---'];
  const dot = document.getElementById('status-dot');
  dot.style.background = siColor;
  dot.classList.toggle('pulse', hasData && [3,4,5].includes(stateRaw));
  document.getElementById('status-text').style.color   = siColor;
  document.getElementById('status-text').textContent   = siLabel;

  // ── Autonomia ──
  document.getElementById('time-value').textContent = hasData ? fmtTime(timeMins) : '---';

  // ── Power columns (col_valid[i] = i < inv_count) ──
  for (let i = 0; i < 3; i++) {
    const col = document.getElementById(`col-${i}`);
    const vis = i < invCount;
    col.style.display = vis ? 'flex' : 'none';
    if (vis) {
      const w  = powers[i];
      const vEl = document.getElementById(`val-${i}`);
      vEl.textContent = w >= 0 ? `+${w}` : `${w}`;
      vEl.style.color = w < 0 ? C.teal : C.green;
    }
  }
  // vsep-0: visible if col-0 AND col-1 present
  document.getElementById('vsep-0').style.display = invCount >= 2 ? 'block' : 'none';
  // vsep-1: visible if col-2 present and at least one to the left
  document.getElementById('vsep-1').style.display = invCount >= 3 ? 'block' : 'none';

  // ── WiFi bar ──
  const wEl = document.getElementById('wifi-text');
  if (wifi === 'none') {
    wEl.textContent = 'WiFi: ---';
    wEl.style.color = C.vdim;
  } else if (wifi === 'disconnected') {
    wEl.textContent = 'WiFi: non connesso';
    wEl.style.color = C.dim;
  } else {
    wEl.textContent = 'Connesso al WiFi  |  192.168.1.50';
    wEl.style.color = C.accent;
  }
}

document.querySelectorAll('input,select').forEach(el => el.addEventListener('input', render));
render();
</script>
</body>
</html>
